name: Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd /opt/vyatsu-schedule-bot

            git fetch origin
            git reset --hard origin/master

            source .venv/bin/activate

            pip install -r requirements.txt

            sudo systemctl restart vyatsu-schedule-bot

            systemctl is-active --quiet vyatsu-schedule-bot